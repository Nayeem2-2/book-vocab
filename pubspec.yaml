name: book_vocab
description: A multi-book English-Bangla vocabulary reader.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5
  cunning_document_scanner: 3.1.0
  google_mlkit_text_recognition: 1.0.2
  image: 4.12.0
  http: 1.6.0
  unorm_dart: 0.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21